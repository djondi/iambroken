
# Bright Agent (STAR) — GitHub Actions

name: Bright Agent (DAST)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: bright-agent-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  bright-agent:
    if: >-
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ASSET: bright-agent-linux-x64

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download & verify Bright Agent
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/NeuraLegion/bright-agent-dist/releases/latest/download"
          curl -fsSL -o "${ASSET}" "${base}/${ASSET}"
          curl -fsSL -o "${ASSET}.sha256" "${base}/${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"
          chmod +x "${ASSET}"

      # NEW: Verify the PHP application can start
      - name: Test PHP application startup
        run: |
          docker compose up -d --build
          sleep 5
          docker compose ps
          curl --fail --show-error http://127.0.0.1:8000/
          docker compose down

      - name: Run Bright Agent
        env:
          LOCAL_REPO_PATH: ${{ github.workspace }}
          REPO_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
          INFERENCE_URL: "https://api.openai.com/v1"
          INFERENCE_TOKEN: ${{ secrets.INFERENCE_TOKEN }}
          SCAN_SCOPE: full
          AI_MODEL: "gpt-5.4-mini,gpt-5.4"
          BRIGHT_HOSTNAME: app.brightsec.com
          BRIGHT_DEBUG: "1"
        run: "${{ runner.temp }}/${{ env.ASSET }}"

      - name: Upload Bright Agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-agent-logs
          path: ~/.bright-agent/logs/
          if-no-files-found: ignore
